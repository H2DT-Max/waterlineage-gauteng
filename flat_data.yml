name: Update Gauteng Water Telemetry (Flat Data)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Johannesburg Water & Gauteng Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/scrape_joburg_water.py

      - name: Commit updated outages.json if changed
        run: |
          git config user.name "WaterLineage FlatData Bot"
          git config user.email "actions@github.com"
          git add data/outages.json public/data/outages.json
          git diff --staged --quiet || git commit -m "chore(telemetry): sync verified Gauteng reservoir status"
          git push
